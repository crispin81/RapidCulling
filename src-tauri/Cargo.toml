[package]
name = "rapidculling"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "rapidculling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.5"
rawler = "0.8.0"
chrono = "0.4.45"
base64 = "0.23.1"
dirs = "7.0.0"
sysinfo = "0.32"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
